name: Recalculate support levels

# BACKUP ONLY: the evening run is driven by cron-job.org (README "ตัวตั้งเวลา"); this late GitHub run then
# finds every symbol current and does nothing.
#
# 22:00 UTC = 18:00 EDT / 17:00 EST: always after the 16:00 New York close.
# The endpoint handles at most 8 symbols per call (Twelve Data free plan: 8 credits/minute)
# and reports how many are left; this job pauses ~1 minute between calls until none are.
on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Recalculate even if levels are already up to date"
        type: boolean
        default: false

concurrency:
  group: recalculate-supports
  cancel-in-progress: false

jobs:
  recalculate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      FORCE: ${{ inputs.force && '&force=1' || '' }}
    steps:
      - name: Call /api/cron/recalculate (batches of 8 per minute)
        run: |
          offset=0
          for i in 1 2 3 4 5 6; do
            resp=$(curl --fail-with-body -sS --retry 2 --retry-delay 10 --max-time 90 \
              -X POST -H "Authorization: Bearer $CRON_SECRET" \
              "${APP_URL%/}/api/cron/recalculate?offset=${offset}${FORCE}")
            echo "$resp"
            [ "$(echo "$resp" | jq -r '.remaining // 0')" = "0" ] && break
            offset=$(echo "$resp" | jq -r '.next // 0')
            sleep 61
          done
