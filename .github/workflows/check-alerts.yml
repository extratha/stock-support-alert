name: Check support alerts

# BACKUP ONLY: GitHub starts scheduled runs hours late (5-7 h measured), so the daily checks are driven by cron-job.org
# (see README "ตัวตั้งเวลา"). Running both is safe: each check is recorded in job_runs and alerts are claimed.
#
# Twice a day, at 10:30 and 13:30 America/New_York (21:30/00:30 in Thailand in summer, 22:30/01:30 in winter).
# GitHub cron is UTC and ignores DST, so both candidates of each check are scheduled:
#   14:30 UTC = 10:30 EDT   15:30 UTC = 10:30 EST
#   17:30 UTC = 13:30 EDT   18:30 UTC = 13:30 EST
# The endpoints (mode=daily) accept a run from each check's time until the next one (the last until the
# close), since scheduled runs are often late; the first complete run of a check records it, so the other
# candidate is a no-op (see src/lib/jobs/checkAlerts.ts).
#
# Twelve Data's free plan allows 8 credits/minute, so quotes are fetched in batches of up to
# 8 symbols with a ~1 minute pause (20 symbols ~ 2 extra minutes) before the actual check,
# which then reads everything from the cache.
on:
  schedule:
    - cron: "30 14 * * 1-5"
    - cron: "30 15 * * 1-5"
    - cron: "30 17 * * 1-5"
    - cron: "30 18 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the market-hours / time-window check (testing)"
        type: boolean
        default: false

concurrency:
  group: check-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      FORCE: ${{ inputs.force && '&force=1' || '' }}
    steps:
      - name: Warm quote cache (batches of 8 per minute)
        run: |
          for i in 1 2 3 4 5 6; do
            resp=$(curl --fail-with-body -sS --retry 2 --retry-delay 10 --max-time 90 \
              -X POST -H "Authorization: Bearer $CRON_SECRET" \
              "${APP_URL%/}/api/cron/quotes?mode=daily${FORCE}")
            echo "$resp"
            [ "$(echo "$resp" | jq -r '.remaining // 0')" = "0" ] && break
            sleep 61
          done

      - name: Call /api/cron/check
        run: |
          curl --fail-with-body -sS --retry 2 --retry-delay 10 --max-time 90 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/check?mode=daily${FORCE}"
