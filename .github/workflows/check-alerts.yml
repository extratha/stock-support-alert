name: Check support alerts

# Once a day, 4 hours after the US open (13:30 America/New_York).
# GitHub cron is UTC and ignores DST, so both candidates are scheduled:
#   17:30 UTC = 13:30 EDT (summer)   18:30 UTC = 13:30 EST (winter)
# The endpoints (mode=daily) only accept the run that lands in the 50 minutes starting at
# 13:30 New York time, so exactly one of the two does the work; the other is a no-op.
#
# Twelve Data's free plan allows 8 credits/minute, so quotes are fetched in batches of up to
# 8 symbols with a ~1 minute pause (20 symbols ~ 2 extra minutes) before the actual check,
# which then reads everything from the cache.
on:
  schedule:
    - cron: "30 17 * * 1-5"
    - cron: "30 18 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the market-hours / time-window check (testing)"
        type: boolean
        default: false

concurrency:
  group: check-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      FORCE: ${{ inputs.force && '&force=1' || '' }}
    steps:
      - name: Warm quote cache (batches of 8 per minute)
        run: |
          for i in 1 2 3 4 5 6; do
            resp=$(curl --fail-with-body -sS --retry 2 --retry-delay 10 --max-time 90 \
              -X POST -H "Authorization: Bearer $CRON_SECRET" \
              "${APP_URL%/}/api/cron/quotes?mode=daily${FORCE}")
            echo "$resp"
            [ "$(echo "$resp" | jq -r '.remaining // 0')" = "0" ] && break
            sleep 61
          done

      - name: Call /api/cron/check
        run: |
          curl --fail-with-body -sS --retry 2 --retry-delay 10 --max-time 90 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/check?mode=daily${FORCE}"
